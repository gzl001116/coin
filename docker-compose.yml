services:
  app:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: coin
      DB_USERNAME: coin
      DB_PASSWORD: coin_secret
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      POINTS_RECHARGE_FEE_RATE: "0.03"
      SELLER_WITHDRAWAL_FEE_RATE: "0.05"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -lc "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coin
      MYSQL_USER: coin
      MYSQL_PASSWORD: coin_secret
      MYSQL_ROOT_PASSWORD: root_secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
volumes:
  mysql_data:
