services:
  app:
    image: php:8.3-cli
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:8000"
    depends_on:
      - mysql
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coin
      MYSQL_USER: coin
      MYSQL_PASSWORD: coin_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
volumes:
  mysql_data:
